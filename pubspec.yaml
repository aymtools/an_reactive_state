name: an_reactive_state
description: "A high-performance synchronous reactive graph engine for Dart. Features lazy evaluation, async isolation via Zones, and absolute memory safety with Cancellable."
version: 1.1.0

homepage: https://github.com/aymtools/an_reactive_state/
issue_tracker: https://github.com/aymtools/an_reactive_state/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cancellable: ^2.6.0

dev_dependencies:
  test: ^1.24.0
  lints: ^2.1.0
